name: Benchmark on GitHub-hosted Windows

on: [push]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 12
    
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Benchmark
      shell: powershell
      working-directory: ${{github.workspace}}
      run: python buildbot\runCI.py -workdir ${{github.workspace}}\labs -runner WinZen3
